  - name: Aaron Löffler
  - name: Michelle Sieburg
  - name: Clemens Pittrof
  - name: Zarah Janda
    url: https://www.ruprecht.de/author/zarah-janda/
  paper:
    summary: Was will ich? Mehr! Ich will mehr Sport treiben, mehr lesen und mehr an mir arbeiten. Und ich will weniger. Weniger Süßigkeiten essen, weniger Zeit in sozialen Medien verbringen und weniger Selbstzweifel haben. Das in diesem Jahr umzusetzen, kann mir nur guttun und mich glücklicher machen.
    url: https://www.ruprecht.de/2021/01/31/nichts-mehr-auszusetzen/
  categories: ["FreeText"]
  tags: []

