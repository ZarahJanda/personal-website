  - name: Zarah Janda
    url: https://orcid.org/0009-0006-4784-0324
  - name: et al.
  - name: Jean-Laurent Casanova
  paper:
    summary: Schwere mykobakterielle Erkrankungen können durch erbliche Defekte der Interferon-gamma-Immunität entstehen. Diese Studie identifiziert einen X-chromosomalen MCTS1-Mangel bei Männern aus mehreren Ländern, deren Translations-Reinitiationsfaktor vollständig fehlt, was selektiv die Produktion der Kinase JAK2 über verschiedene Zelltypen hinweg beeinträchtigt.
