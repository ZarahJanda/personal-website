degrees:
- name: PhD in the Jena Experiment and Associate PhD in ECO-N
  icon: fa-university
  timeframe: since 2024
  institution:
    name: Leipzig University
    url: "https://www.lw.uni-leipzig.de/en"
  extracurricularActivities: #(optional)
  - Main Coordinator of the Symposium 'Science TBD' - Organisation of an interdisciplinary symposium at iDiv in March 2026
  - CO2e emissions Assessment of PhD Project - Calculation and analysis of the total CO2e emissions generated thoughout my PhD, including travels, fieldwork and lab activities. The results will be published alongside my dissertation to quantify the environmental impact of my research and propose straegies for emission reduction.
  - Sustainable Development Course - Completed the lecture series in 2024 and gave a guest lecture in Ocotber 2025 on 'Sustainability and One Health' focusing on the links between ecological integrity, human health and sustainable practices.
  - iDiv PhD Representative - PhD Meeting coordination, Code of Conduct, Supervision at iDiv
  - Jena Experiment PhD Representative - PhD meeting coordination, communiation with Principle Investigators
  customSections: #(optional)
    - name: Work Package 1 - Long-term Soil Multistability
      content: Investigation of the long-term effects of plant species richness on microbial biomass within a grassland experiment. Focus on long-term stability, resistance and recovery from climate extremes.
    - name: Work Package 2 - Soil multresistance and multirecovery along a stress gradient
      content: Examination of plant species diversity on multisple soil functions within a controlled greenhouse experiment simulating a water-stress gradient.
    - name: Work Package 3 - Intra- and Inter-annual soil multistability
      content: Study of plant species richness effects on the seasonal stability of multisple soil functions within the Jena Experiment.
