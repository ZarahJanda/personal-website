# Your experiences
experiences:
- company:
    name: German Centre for Integrative Biodiversity Research Halle-Jena-Leipzig – iDiv
    url: "https://www.idiv.de/"
    location: Leipzig, Germany
    #logo: /images/experiences/company.png
    #darkLogo: /images/experiences/company-dark.png #(optional), Can optionally show a different logo for dark theme
    # company overview
    overview: The German Centre for Integrative Biodiversity Research – iDiv is focused on understanding the variety of life on earth. We measure and monitor how this diversity is changing, and how it affects ecosystem functioning and services.
  positions:
  - designation: Doctoral Researcher
    start: April 2024
    # don't provide end date if you are currently working there. It will be replaced by "Present"
    # end: Dec 2020
    # give some points about what was your responsibilities at the company.
    responsibilities:
    - Fieldwork - taking soil samples at the Jena Experiment field side
    - Laboratory Measurments - analysis of soil samples, e.g. percentage of waterstable aggregates, soil microbial biomass, basal respiration and the activity of hydrolytic enzymes
    - Data Analysis - statistical analysis of measurements to identify the effect of plant species richness on several measures
