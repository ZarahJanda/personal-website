- title: Somatic deficiency of the human E3 ubiquitin ligase CBL in leukocytes impairs B cell but not T cell development and function
  publishedIn:
    name: Nature Immunology
    date: 15 January 2026
    url: https://doi.org/10.1038/s41590-025-02381-7
  authors:
  - name: Taja Vatovec
  - name: Anna-Lena Neehus
  - name: Jean-Laurent Casanova
  - name: Jonathan Bohlen
    url: https://orcid.org/0000-0003-0458-9484
  - name: et al.
  paper:
    summary: This study examines individuals who carry somatic, leukocyte-specific loss-of-function variants in the E3 ubiquitin ligase CBL.
    url: https://doi.org/10.1038/s41590-025-02381-7
  categories: ["MolecularBiology"]
  tags: ["Immunology", "B Cells", "Ubiquitin Ligase", "Inborn Errors of Immunity"]
- title: Human MCTS1-dependent translation of JAK2 is essential for IFN-γ immunity to mycobacteria
  publishedIn:
    name: Cell
    date: 23 October 2023
    url: https://www.cell.com/cell/fulltext/S0092-8674(23)01078-4
  authors:
  - name: Jonathan Bohlen
    url: https://orcid.org/0000-0003-0458-9484
  - name: Qinhua Zhou
  - name: Quentin Philippot
  - name: Zarah Janda
    url: https://orcid.org/0009-0006-4784-0324
  - name: et al.
  - name: Jean-Laurent Casanova
  paper:
    summary: Severe mycobacterial disease can arise from inherited defects in interferon-gamma immunity. This study identifies X-linked MCTS1 deficiency in men from several countries whose translation re-initiation factor is completely lost, which selectively impairs production of the kinase JAK2 across cell types. 
    url: https://doi.org/10.1016/j.cell.2023.09.024
  categories: ["MolecularBiology"]
  tags: ["Immunology", "Genetics", "JAK2", "Mycobacteria", "Inborn Errors of Immunity"]

