    #logo: /images/experiences/company.png
    #darkLogo: /images/experiences/company-dark.png #(optional), Can optionally show a different logo for dark theme
    # company overview
    overview: Heidelberg University supports the climate policy activities of the state of Baden-Württemberg and pursues the goal of achieving net greenhouse gas neutrality by 2040 through gradual reduction measures.
  positions:
  - designation: Student Assistant
